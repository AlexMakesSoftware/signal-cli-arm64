name: Build

# Once a day: if signal-cli has a release we haven't built, build Signal's native library for aarch64 from
# Signal's source, swap it into that release, test it, and publish it with an attestation.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      signal-cli-version:
        description: signal-cli release to build (without the "v"). Leave blank for the latest.
        default: ""

permissions: {}

# Two runs at once could both decide a release is missing and both try to publish it.
concurrency:
  group: build
  cancel-in-progress: false

env:
  # AsamK's release-signing key, as published at https://github.com/AsamK.gpg. Every release since at
  # least v0.13.0 is signed with it.
  SIGNAL_CLI_SIGNING_KEY_FINGERPRINT: FA10826A74907F9EC6BBB7FC2BA2CD21B5B09570  # gitleaks:allow (public key fingerprint)
  RUSTUP_INIT_URL: https://static.rust-lang.org/rustup/archive/1.28.2/aarch64-unknown-linux-gnu/rustup-init
  RUSTUP_INIT_SHA256: e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c
  # How long signal-cli gets to print a device-link URI, proving the native library loaded and works.
  LINK_CHECK_SECONDS: 60

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      needed: ${{ steps.release.outputs.needed }}
      java: ${{ steps.java.outputs.release }}
      java-on-master: ${{ steps.java.outputs.master }}
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_VERSION: ${{ inputs.signal-cli-version }}
    steps:
      - name: Pick the signal-cli release and see if we have built it
        id: release
        run: |
          version=${REQUESTED_VERSION:-$(gh api repos/AsamK/signal-cli/releases/latest --jq .tag_name)}
          version=${version#v}
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a signal-cli version: $version"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" --silent 2> lookup-error; then
            needed=false
          elif grep -q 'HTTP 404' lookup-error; then
            needed=true
          else
            cat lookup-error
            exit 1
          fi
          echo "signal-cli $version, build needed: $needed"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Read the Java version signal-cli needs, at the release and on master
        id: java
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          java_version_at() {
            gh api "repos/AsamK/signal-cli/contents/build.gradle.kts?ref=$1" -H 'Accept: application/vnd.github.raw' \
              | sed -nE 's/^\s*targetCompatibility = JavaVersion\.VERSION_([0-9]+)\s*$/\1/p'
          }
          release=$(java_version_at "v$VERSION")
          master=$(java_version_at master)
          for found in "$release" "$master"; do
            if ! [[ $found =~ ^[0-9]+$ ]]; then
              echo "Couldn't read targetCompatibility from signal-cli's build.gradle.kts. Has its format changed?"
              exit 1
            fi
          done
          echo "Java $release for v$VERSION, Java $master on master"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "master=$master" >> "$GITHUB_OUTPUT"

  # Fails (and so emails) weeks before a signal-cli release needs a newer Java than the current one. Doesn't
  # stop the build.
  java-early-warning:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    env:
      RELEASE_JAVA: ${{ needs.check.outputs.java }}
      MASTER_JAVA: ${{ needs.check.outputs.java-on-master }}
    steps:
      - name: Compare
        run: |
          if (( MASTER_JAVA > RELEASE_JAVA )); then
            echo "::error::The next signal-cli will need Java $MASTER_JAVA (now $RELEASE_JAVA). Install it on the machines that run it."
            exit 1
          fi
          echo "No change coming: Java $RELEASE_JAVA."

  # No write permissions: this job runs Signal's build scripts and downloads Rust crates.
  build:
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      SIGNAL_CLI_VERSION: ${{ needs.check.outputs.version }}
      JAVA_VERSION: ${{ needs.check.outputs.java }}
    steps:
      - name: Download signal-cli and check its signature
        run: |
          base="https://github.com/AsamK/signal-cli/releases/download/v${SIGNAL_CLI_VERSION}"
          archive="signal-cli-${SIGNAL_CLI_VERSION}.tar.gz"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/$archive.asc"
          export GNUPGHOME="$(mktemp -d)"
          curl -fsSL https://github.com/AsamK.gpg | gpg --batch --import
          status=$(gpg --batch --status-fd 1 --verify "$archive.asc" "$archive")
          grep -q "^\[GNUPG:\] VALIDSIG ${SIGNAL_CLI_SIGNING_KEY_FINGERPRINT} " <<< "$status"
          tar -xzf "$archive"

      - name: Find the libsignal version signal-cli needs
        id: libsignal
        run: |
          jar=$(ls signal-cli-"${SIGNAL_CLI_VERSION}"/lib/libsignal-client-*.jar)
          version=${jar##*/libsignal-client-}
          version=${version%.jar}
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a libsignal version: $version"
            exit 1
          fi
          echo "libsignal $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out libsignal at that version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: signalapp/libsignal
          ref: v${{ steps.libsignal.outputs.version }}
          path: libsignal
          submodules: recursive
          persist-credentials: false

      # Signal's own Linux build uses these (libsignal's java/Dockerfile). protoc comes from Ubuntu's signed archive.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake make protobuf-compiler python3 zip

      - name: Install Rust
        working-directory: libsignal
        run: |
          if ! command -v rustup >/dev/null; then
            curl -fsSL -o rustup-init "$RUSTUP_INIT_URL"
            echo "$RUSTUP_INIT_SHA256  rustup-init" | sha256sum -c -
            chmod +x rustup-init
            ./rustup-init -y --profile minimal --default-toolchain none
            rm rustup-init
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal

      - name: Build the Java library with Signal's own script
        working-directory: libsignal
        run: java/build_jni.sh desktop

      - name: Check it is an aarch64 library
        id: library
        run: |
          library=libsignal/java/client/src/main/resources/libsignal_jni_aarch64.so
          description=$(file "$library")
          echo "$description"
          grep -q 'ARM aarch64' <<< "$description"
          glibc=$(objdump -T "$library" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -n 1)
          glibc=${glibc#GLIBC_}
          echo "Newest glibc needed: $glibc"
          sha256=$(sha256sum "$library" | cut -d ' ' -f 1)
          echo "SHA-256: $sha256"
          echo "path=$library" >> "$GITHUB_OUTPUT"
          echo "glibc=$glibc" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      # Keep only our library, so the jar can't fall back to anything else.
      - name: Swap it into signal-cli
        run: |
          jar=$(ls signal-cli-"${SIGNAL_CLI_VERSION}"/lib/libsignal-client-*.jar)
          zip -d "$jar" '*.so' '*.dylib' '*.dll'
          zip -j "$jar" "${{ steps.library.outputs.path }}"
          unzip -l "$jar" | grep -E '\.(so|dylib|dll)$'

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # `link` loads libsignal and asks Signal's server for a device-link URI. The URI is never printed: these
      # logs are public, and nothing is linked.
      - name: Check signal-cli runs with it
        run: |
          signal_cli=signal-cli-"${SIGNAL_CLI_VERSION}"/bin/signal-cli
          "$signal_cli" --version
          output=$(timeout "$LINK_CHECK_SECONDS" "$signal_cli" --config "$(mktemp -d)" link -n build-check 2>&1 || true)
          if grep -q '^sgnl://linkdevice' <<< "$output"; then
            echo "Native library loaded; got a device-link URI."
          else
            grep -v 'sgnl://' <<< "$output"
            exit 1
          fi

      # The .json file is for install scripts: what's inside, and what it needs to run.
      - name: Package
        env:
          LIBSIGNAL_VERSION: ${{ steps.libsignal.outputs.version }}
          GLIBC: ${{ steps.library.outputs.glibc }}
          LIBRARY_SHA256: ${{ steps.library.outputs.sha256 }}
        run: |
          name="signal-cli-${SIGNAL_CLI_VERSION}-linux-aarch64"
          mkdir dist
          tar -czf "dist/$name.tar.gz" signal-cli-"${SIGNAL_CLI_VERSION}"
          jq -n \
            --arg signal_cli "$SIGNAL_CLI_VERSION" \
            --arg libsignal "$LIBSIGNAL_VERSION" \
            --argjson java "$JAVA_VERSION" \
            --arg glibc "$GLIBC" \
            --arg library_sha256 "$LIBRARY_SHA256" \
            --arg package "$name.tar.gz" \
            '{signal_cli: $signal_cli, libsignal: $libsignal, java: $java, glibc: $glibc,
              library_sha256: $library_sha256, package: $package}' > "dist/$name.json"
          cd dist
          sha256sum "$name.tar.gz" "$name.json" > SHA256SUMS
          cat SHA256SUMS "$name.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      SIGNAL_CLI_VERSION: ${{ needs.check.outputs.version }}
      JAVA_VERSION: ${{ needs.check.outputs.java }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Check the files arrived intact
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      # The .json too: install scripts use it to decide which Java to require.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.json

      - name: Publish the release
        run: |
          name="signal-cli-${SIGNAL_CLI_VERSION}-linux-aarch64"
          libsignal=$(jq -r .libsignal "dist/$name.json")
          cat > notes.md <<EOF
          [signal-cli ${SIGNAL_CLI_VERSION}](https://github.com/AsamK/signal-cli/releases/tag/v${SIGNAL_CLI_VERSION}),
          unchanged except that its libsignal-client jar holds only \`libsignal_jni_aarch64.so\`, built from
          [libsignal v${libsignal}](https://github.com/signalapp/libsignal/tree/v${libsignal}) by
          [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          Needs Java ${JAVA_VERSION} or newer. Check the package before unpacking it:

          \`\`\`
          gh attestation verify ${name}.tar.gz --repo ${GITHUB_REPOSITORY}
          \`\`\`
          EOF
          gh release create "v${SIGNAL_CLI_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "signal-cli ${SIGNAL_CLI_VERSION} for linux-aarch64" \
            --notes-file notes.md \
            dist/*
