name: Trial build

# Stage 1: prove libsignal's Java library builds and loads on aarch64. Run by hand; publishes nothing.

on:
  workflow_dispatch:
    inputs:
      signal-cli-version:
        description: signal-cli release to build for (without the "v")
        default: "0.14.10"

permissions:
  contents: read

env:
  # AsamK's release-signing key, as published at https://github.com/AsamK.gpg. Every release since at
  # least v0.13.0 is signed with it.
  SIGNAL_CLI_SIGNING_KEY_FINGERPRINT: FA10826A74907F9EC6BBB7FC2BA2CD21B5B09570  # gitleaks:allow (public key fingerprint)
  JAVA_VERSION: "25"
  RUSTUP_INIT_URL: https://static.rust-lang.org/rustup/archive/1.28.2/aarch64-unknown-linux-gnu/rustup-init
  RUSTUP_INIT_SHA256: e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c
  GITLEAKS_VERSION: 8.30.1
  # How long signal-cli gets to print a device-link URI, proving the native library loaded and works.
  LINK_CHECK_SECONDS: 60

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" gitleaks

      - name: Scan the whole history
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml

  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      SIGNAL_CLI_VERSION: ${{ inputs.signal-cli-version }}
    steps:
      - name: Download signal-cli and check its signature
        run: |
          base="https://github.com/AsamK/signal-cli/releases/download/v${SIGNAL_CLI_VERSION}"
          archive="signal-cli-${SIGNAL_CLI_VERSION}.tar.gz"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/$archive.asc"
          export GNUPGHOME="$(mktemp -d)"
          curl -fsSL https://github.com/AsamK.gpg | gpg --batch --import
          status=$(gpg --batch --status-fd 1 --verify "$archive.asc" "$archive")
          grep -q "^\[GNUPG:\] VALIDSIG ${SIGNAL_CLI_SIGNING_KEY_FINGERPRINT} " <<< "$status"
          tar -xzf "$archive"

      - name: Find the libsignal version signal-cli needs
        id: libsignal
        run: |
          jar=$(ls signal-cli-"${SIGNAL_CLI_VERSION}"/lib/libsignal-client-*.jar)
          version=${jar##*/libsignal-client-}
          version=${version%.jar}
          echo "libsignal $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check out libsignal at that version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: signalapp/libsignal
          ref: v${{ steps.libsignal.outputs.version }}
          path: libsignal
          submodules: recursive
          persist-credentials: false

      # Signal's own Linux build uses these (libsignal's java/Dockerfile). protoc comes from Ubuntu's signed archive.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake make protobuf-compiler python3 zip

      - name: Install Rust
        working-directory: libsignal
        run: |
          if ! command -v rustup >/dev/null; then
            curl -fsSL -o rustup-init "$RUSTUP_INIT_URL"
            echo "$RUSTUP_INIT_SHA256  rustup-init" | sha256sum -c -
            chmod +x rustup-init
            ./rustup-init -y --profile minimal --default-toolchain none
            rm rustup-init
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install "$(cat rust-toolchain)" --profile minimal

      - name: Build the Java library with Signal's own script
        working-directory: libsignal
        run: java/build_jni.sh desktop

      - name: Check it is an aarch64 library
        id: library
        run: |
          library=libsignal/java/client/src/main/resources/libsignal_jni_aarch64.so
          description=$(file "$library")
          echo "$description"
          grep -q 'ARM aarch64' <<< "$description"
          echo "Newest glibc needed: $(objdump -T "$library" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -n 1)"
          sha256sum "$library"
          echo "path=$library" >> "$GITHUB_OUTPUT"

      # Keep only our library, so the jar can't fall back to anything else.
      - name: Swap it into signal-cli
        run: |
          jar=$(ls signal-cli-"${SIGNAL_CLI_VERSION}"/lib/libsignal-client-*.jar)
          zip -d "$jar" '*.so' '*.dylib' '*.dll'
          zip -j "$jar" "${{ steps.library.outputs.path }}"
          unzip -l "$jar" | grep -E '\.(so|dylib|dll)$'

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # `link` loads libsignal and asks Signal's server for a device-link URI. The URI is never printed: these
      # logs are public, and nothing is linked.
      - name: Check signal-cli runs with it
        run: |
          signal_cli=signal-cli-"${SIGNAL_CLI_VERSION}"/bin/signal-cli
          "$signal_cli" --version
          output=$(timeout "$LINK_CHECK_SECONDS" "$signal_cli" --config "$(mktemp -d)" link -n trial-build 2>&1 || true)
          if grep -q '^sgnl://linkdevice' <<< "$output"; then
            echo "Native library loaded; got a device-link URI."
          else
            grep -v 'sgnl://' <<< "$output"
            exit 1
          fi

      - name: Package
        run: |
          package="signal-cli-${SIGNAL_CLI_VERSION}-linux-aarch64.tar.gz"
          tar -czf "$package" signal-cli-"${SIGNAL_CLI_VERSION}"
          sha256sum "$package"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signal-cli-${{ env.SIGNAL_CLI_VERSION }}-linux-aarch64
          path: signal-cli-${{ env.SIGNAL_CLI_VERSION }}-linux-aarch64.tar.gz
          retention-days: 30
